task: M18_exp
source_path: /mnt/yswang-wan22/exp/dataproc_clip_M18-2_07_20251227122737_DF_v2_output_rightshifted_new # /mnt/yswang-wan22/dataset/streetgs_l3/clip_M18-2_07_20251227122737_DF  # clip_M18-2_07_20251227122737_DF   clip_M18-2_07_20260122201322_DF
model_path: /mnt/yswang-wan22/exp/dataproc_clip_M18-2_07_20251227122737_DF_v2_output_rightshifted_new_recon4v  # model_path: /mnt/yswang-wan22/exp/streetgsc10/clip_M18-2_07_20260122201322_DF_100f_c10 # streetgs_work_6v
exp_name: L3_test
gpus: [5]

data:
  split_test: -1
  split_train: 1
  type: M18
  white_background: false
  selected_frames: [50,80]
  cameras: [0,1,9,10] # [0, 1, 2, 3, 4, 9, 10]
  extent: 20
  use_colmap: false
  filter_colmap: true
  box_scale: 1.35


model:
  use_color_correction: true
  gaussian:
    sh_degree: 1
    fourier_dim: 5
    fourier_scale: 1.
    flip_prob: 0.
  nsg:
    include_bkgd: true
    include_obj: true
    include_sky: true
    opt_track: true

train:
  iterations: 25000 # 50000
  test_iterations: [1000,10000, 25000]
  save_iterations: [1000,10000, 25000]
  checkpoint_iterations: [1000, 25000]

optim:
  prune_box_interval: 100
  densification_interval: 100
  densify_from_iter: 500
  densify_grad_threshold_bkgd: 0.0006  # 0.0006
  densify_grad_abs_bkgd: True
  densify_grad_threshold_obj: 0.0002  # 0.0002
  densify_grad_abs_obj: False
  densify_until_iter: 12500  # 25000
  feature_lr: 0.0025
  max_screen_size: 20
  min_opacity: 0.0075  # 0.005
  opacity_lr: 0.05
  opacity_reset_interval: 3000
  percent_big_ws: 0.1
  percent_dense: 0.01 # 0.01
  position_lr_delay_mult: 0.01
  position_lr_final: 1.6e-06
  position_lr_init: 0.00016
  position_lr_max_steps: 25000  # 50000
  rotation_lr: 0.001
  scaling_lr: 0.005
  semantic_lr: 0.01

  lambda_dssim: 0.2
  lambda_sky: 0.05 # 0.05
  lambda_mask: 0.1
  lambda_reg: 0.1
  lambda_depth_lidar: 0.1 # 0.1

  track_position_lr_delay_mult: 0.01
  track_position_lr_init: 0.005
  track_position_lr_final: 5.0e-5
  track_position_max_steps: 15000  # 30000

  track_rotation_lr_delay_mult: 0.01
  track_rotation_lr_init: 0.001
  track_rotation_lr_final: 1.0e-5
  track_rotation_max_steps: 15000  # 30000

  lidar_clip: [0.1, 200.0]
  lidar_weigth_decay: 1.0

render:
  fps: 24
  concat_cameras: [1, 0, 2]